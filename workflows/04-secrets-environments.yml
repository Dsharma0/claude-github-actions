# STAGE 4 — Secrets, variables, environments, approvals, OIDC
# Setup first (repo > Settings):
#   Secrets and variables > Actions > New secret   : MY_SECRET = anything
#   Secrets and variables > Actions > Variables    : APP_NAME  = demo
#   Environments > New environment "production"    : add yourself as Required reviewer
name: 04 Secrets and Environments

on:
  workflow_dispatch:

jobs:
  use-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets are masked in logs
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          echo "App name (variable): ${{ vars.APP_NAME }}"
          echo "Secret length: ${#MY_SECRET}"
          echo "Printing it shows: $MY_SECRET"      # -> ***

  deploy-prod:
    needs: use-secret
    runs-on: ubuntu-latest
    environment:
      name: production          # pauses here until a reviewer approves
      url: https://example.com
    steps:
      - run: echo "Deploying with approval..."

  # OIDC: get short-lived cloud credentials with NO stored secret.
  # Example shape for AWS (needs an IAM role trusting GitHub) — read, don't run yet.
  oidc-example:
    if: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/gha-deploy
          aws-region: us-east-1
      - run: aws sts get-caller-identity
