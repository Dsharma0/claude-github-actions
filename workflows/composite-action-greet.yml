# STAGE 5c — A composite action.
# Save this file as:  .github/actions/greet/action.yml
name: Greet
description: Prints a greeting (demo composite action)
inputs:
  who:
    description: Who to greet
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: echo "Hello, ${{ inputs.who }} — from a composite action"
